schema_version: "1.0"
name: implementing-cashback
description: "Pedido em português para executar um plano de implementação já aprovado de cashback no checkout de uma loja Node pequena, com o usuário fora por algumas horas."
tags: [implementing, reserved]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    A spec e o plano do cashback foram aprovados ontem, estão em
    `docs/devorb/specs/2026-11-09-cashback-design.md` e
    `docs/devorb/plans/2026-11-10-cashback.md`, já na branch `feat/cashback`.
    Executa o plano pra mim. Vou ficar umas horas em reunião com o financeiro,
    quando eu voltar quero ver como ficou.
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill, Agent]
