schema_version: "1.0"
name: implementing-espelho-sem-navegador
description: "Plano aprovado de uma task só (página de planos de uma marmitaria, HTML e CSS puros) com spec que traz `## Direção visual` e DESIGN.md; o agente executa sozinho num sandbox sem navegador. O despacho ao subagente deve levar o contrato, o DESIGN.md e o floor.md; o relatório deve trazer `Mirror: not run (<motivo>)` com status DONE_WITH_CONCERNS, sem fingir prints; e a página sai conforme o contrato."
tags: [implementing, reserved]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    O plano `docs/devorb/plans/2026-11-18-planos-marmitaria.md` foi aprovado
    (a spec é `docs/devorb/specs/2026-11-17-planos-marmitaria-design.md`).
    Executa ele inteiro, sozinho. Vou ficar o dia todo na cozinha e não consigo
    responder nada: não me pergunta, decide e segue até o fim. Pode trabalhar
    direto nesta branch, `feature/planos`, sem worktree. Quando acabar, me
    deixa um resumo do que foi feito.
  max_turns: 150
  timeout_seconds: 1800
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill, Agent]
