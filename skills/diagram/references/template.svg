<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240" role="img" aria-labelledby="slug-title slug-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="slug-title">Sign-in request</title>
  <desc id="slug-desc">The browser sends the user's credentials to the API, which checks them and starts a session.</desc>
  <!-- Replace "slug" in every id with the file name. Swap the hex colors for the project's DESIGN.md tokens when it has them. -->
  <defs>
    <marker id="slug-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#6b6f7b"/>
    </marker>
  </defs>

  <!-- 1. Background -->
  <rect width="100%" height="100%" fill="#f7f6f2"/>

  <!-- 2. Connectors first, then label masks and labels -->
  <path d="M200 68 H252 A8 8 0 0 1 260 76 V164 A8 8 0 0 0 268 172 H320" fill="none" stroke="#6b6f7b" stroke-width="1.5" marker-end="url(#slug-arrow)"/>
  <rect x="268" y="112" width="72" height="16" rx="2" fill="#f7f6f2"/>
  <text x="304" y="123.5" font-size="9" text-anchor="middle" letter-spacing="0.06em" fill="#6b6f7b">CREDENTIALS</text>

  <!-- 3. Boxes last: an opaque fill keeps lines from showing through -->
  <rect x="40" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="120" y="66" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142">Browser</text>
  <text x="120" y="82" font-size="10" text-anchor="middle" fill="#6b6f7b">sign-in form</text>

  <rect x="320" y="144" width="160" height="56" rx="6" fill="#ffffff" stroke="#b5462a" stroke-width="1.5"/>
  <text x="400" y="170" font-size="13" font-weight="600" text-anchor="middle" fill="#2d3142">API</text>
  <text x="400" y="186" font-size="10" text-anchor="middle" fill="#6b6f7b">checks, starts session</text>
</svg>
