schema_version: "1.0"
name: reviewing-cupom-desconto
description: >-
  Checkout de loja em Node com uma spec aprovada de cupom de desconto; a branch
  feature/cupom-desconto implementa o cupom, mas o desconto ignora a quantidade
  dos itens, dá um desconto de fidelidade que ninguém pediu e tira a validação
  de quantidade da entrada que vem da requisição. O agente revisa a branch
  antes do merge, sem mexer no código.
tags: [reviewing]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Revisa a branch `feature/cupom-desconto` antes de eu fazer o merge na
    `main`. Ela implementa a spec do cupom de desconto, que já foi aprovada. Não
    vou conseguir responder perguntas hoje, então me entrega a revisão completa
    numa resposta só.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Agent]
