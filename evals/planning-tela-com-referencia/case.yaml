schema_version: "1.0"
name: planning-tela-com-referencia
description: Site estático com spec aprovada cuja `## Direção visual` é Replicate e aponta um pacote de referência pronto em design/referencias/; o agente escreve o plano de implementação num caminho dado, e o passo de interface precisa nomear o pacote e o critério de pronto do espelho (`Mirror`).
tags: [planning]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    A spec da landing foi aprovada:
    `docs/devorb/specs/2026-11-12-landing-design.md`. Escreve o plano de
    implementação dela em `docs/devorb/plans/2026-11-13-landing.md`. Por agora
    é só o plano: a implementação fica para outra sessão, que vai seguir esse
    arquivo. Hoje não consigo responder perguntas; o que a spec não decidir,
    decide pelo código e registra no plano.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill]
