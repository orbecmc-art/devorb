schema_version: "1.0"
name: using-devorb-auto-retro
description: Agenda de clínica com as anotações da sessão de ontem, em que o mesmo erro se repetiu três vezes; o usuário pergunta por quê e como não repetir. A skill de retrospectiva precisa disparar sem ser chamada pelo nome.
tags: [using-devorb]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    por que você errou a mesma coisa três vezes na sessão de ontem? anotei em `docs/sessoes/2026-11-12.md`. o que dá pra mudar pra não repetir?
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
