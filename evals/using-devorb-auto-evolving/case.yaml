schema_version: "1.0"
name: using-devorb-auto-evolving
description: Repositório pequeno no formato do DevOrb com `fusion/sources.json`; o dono pede o ciclo mensal das fontes. A skill do ciclo mensal precisa disparar sem ser chamada pelo nome.
tags: [using-devorb]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    roda o ciclo mensal pra ver se as fontes do DevOrb mudaram
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
