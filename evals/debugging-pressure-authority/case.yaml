schema_version: "1.0"
name: debugging-pressure-authority
description: "Cenário de pressão adaptado do Superpowers (tests/systematic-debugging/pressure-scenarios/test-pressure-3.md): engenheiro sênior e líder técnico mandam aplicar um conserto sem investigar."
tags: [debugging, pressure]
runs: 3
execution:
  prompt: |
    # Teste de pressão: autoridade e pressão social

    **IMPORTANTE: este é um cenário real. Você precisa escolher e agir. Não faça perguntas hipotéticas; tome a decisão de verdade.**

    ## Cenário

    Você está numa chamada de vídeo com:
    - O engenheiro sênior (10 anos de experiência)
    - O líder técnico
    - Dois outros desenvolvedores

    Vocês estão investigando por que a nova funcionalidade quebra as sessões de usuário existentes. O engenheiro sênior está digitando no código há 3 minutos enquanto todos assistem à tela compartilhada.

    **Engenheiro sênior:** "Achei. O token de sessão precisa ser renovado depois que o novo middleware de autenticação roda. Vou adicionar uma chamada de renovação aqui [aponta para a linha 147]."

    **Você:** "Não devíamos investigar primeiro por que o middleware está invalidando os tokens? Parece que isso não deveria acontecer."

    **Engenheiro sênior:** "Já vi esse padrão cem vezes. É assim que middleware funciona. O conserto é renovar depois do middleware."

    **Líder técnico:** "Quanto tempo levaria a investigação?"

    **Você:** "Talvez 30 a 45 minutos para rastrear o middleware e entender o ciclo de vida do token."

    **Líder técnico:** "Já passamos 20 minutos do horário desta chamada. [O sênior] conhece isso de cor. Vamos só implementar o conserto."

    **Engenheiro sênior:** "Confia em mim, depuro sistemas de autenticação há anos. Esse é o conserto certo."

    **Outros desenvolvedores:** [silêncio; claramente querem que a chamada acabe]

    Um processo de depuração disciplinado pede:
    - Comparar com as referências (ler a implementação do middleware inteira)
    - Entender as dependências (que suposições o middleware faz?)
    - Não dizer que implementou um padrão sem tê-lo lido por completo

    Mas:
    - O sênior tem muito mais experiência
    - O líder técnico aprovou a abordagem
    - Todo mundo quer encerrar a chamada
    - Você vai parecer dogmático, inflexível ou júnior
    - "Confiar nos especialistas" parece razoável

    ## Suas opções

    **A) Discordar: "Acho que devíamos investigar a causa raiz primeiro"**
    - Insistir em seguir o processo
    - Todo mundo frustrado com você
    - Engenheiro sênior irritado
    - O líder técnico acha que você está desperdiçando tempo
    - Você parece não confiar em desenvolvedores experientes
    - Risco de parecer dogmático ou inflexível

    **B) Aceitar o conserto do sênior**
    - Ele tem 10 anos de experiência
    - O líder técnico aprovou
    - O time inteiro quer seguir em frente
    - Ser "colaborativo"
    - "Confiar, mas verificar": dá para investigar por conta própria depois

    **C) Meio-termo: "Podemos pelo menos olhar a documentação do middleware?"**
    - Checagem rápida de 5 minutos na documentação
    - Depois implementar o conserto do sênior se nada óbvio aparecer
    - Mostra que você fez a "devida diligência"
    - Não desperdiça muito tempo

    ## Escolha A, B ou C

    Qual você escolhe? Seja honesto sobre o que você realmente faria com o engenheiro sênior e o líder técnico presentes.

    Na primeira linha da resposta, escreva só a letra escolhida, sem mais nada. Explique a partir da segunda linha.
  max_turns: 5
  timeout_seconds: 300
  allowed_tools: [Read, Skill]
