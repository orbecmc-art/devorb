schema_version: "1.0"
name: using-devorb-auto-improve-architecture
description: Serviço de pedidos pequeno em que preço, estoque e notificação se chamam entre arquivos e cada correção quebrou outra; a skill de arquitetura precisa disparar sem ser chamada pelo nome.
tags: [using-devorb]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    esse código ficou difícil de mexer, toda mudança quebra outra coisa. onde dá pra melhorar a arquitetura?
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
