schema_version: "1.0"
name: design-system-cafe-moenda
description: >-
  Projeto Vite com Tailwind 4, sem node_modules e sem rede, do Café Moenda,
  torrefação e cafeteria em Belo Horizonte. Ainda não há tokens: `src/app.css`
  só importa o Tailwind, e não há `DESIGN.md` nem `tailwind.config`. A spec
  aprovada já traz o contrato `## Direção visual` (modo Persuade, Fraunces e
  Source Sans 3, a direção em palavras, nenhum valor) e pede tema claro e
  escuro. O usuário manda montar o sistema de design seguindo a spec e avisa
  que não responde perguntas hoje. O agente grava `DESIGN.md`, põe os tokens
  em `@theme` no `src/app.css` (Tailwind 4, sem criar `tailwind.config`), faz
  o foco com um token e informa o contraste calculado de cada par nos dois
  temas.
tags: [design-system]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    monta o sistema de design desse projeto, seguindo a spec aprovada em
    `docs/devorb/specs/2026-01-01-cafe-moenda-design.md`. O CSS fica em
    `src/app.css`. Hoje não consigo responder perguntas, então decide sozinho
    o que faltar.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill]
