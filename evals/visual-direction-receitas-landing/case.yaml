schema_version: "1.0"
name: visual-direction-receitas-landing
description: >-
  Pasta quase vazia com a spec aprovada da landing do Lote, ferramenta fictícia
  que junta e pesquisa os logs de deploy de times de desenvolvimento. A spec
  não tem `## Direção visual` e não há `DESIGN.md`. O dono deu só três números
  (30 dias de histórico e 5 pessoas no plano gratuito, R$ 49 por mês no plano
  Time) e a lista do que o produto faz. O usuário manda construir a landing em
  `index.html` e `styles.css` e avisa que não responde perguntas hoje. O
  agente grava na spec um contrato que cita um padrão de abertura (`hero:`) e
  padrões de seção (`section:`) do cardápio, e a página segue as receitas:
  título grande, leve e com tracking negativo sobre um corpo de leitura, um só
  destaque, cartões com borda fina, um hero com UI construída em HTML, nenhum
  número além dos três dados, e no celular o hero à esquerda, o CTA com a
  largura toda e o h1 entre 32 e 64px.
tags: [visual-direction]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    constrói a landing da spec em `index.html` e `styles.css`. Hoje não
    respondo perguntas.
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill, WebFetch]
