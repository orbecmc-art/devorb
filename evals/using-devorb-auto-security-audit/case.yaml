schema_version: "1.0"
name: using-devorb-auto-security-audit
description: API de pedidos em Node que vai para o ar na semana que vem; o usuário pergunta se está segura. A skill de auditoria de segurança precisa disparar sem ser chamada pelo nome.
tags: [using-devorb]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    esse projeto vai pro ar semana que vem, tá seguro?
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
