schema_version: "1.0"
name: ui-review-equipes
description: >-
  Página de equipes do Quadro, painel de gestão de projetos (texto da
  interface em inglês), já pronta em `index.html` e `styles.css`, com um
  `DESIGN.md` de tokens e a spec aprovada. Problemas plantados: a contagem
  usa `#6b7280`, cor fora dos tokens (`styles.css:122`); o anel de foco do
  botão está dentro de uma `transition` e aparece com fade, e o `DESIGN.md`
  manda o foco aparecer na hora (`styles.css:71` e `:79`); a equipe Finance
  mostra "1 members" (`index.html:28`); o campo de busca tem 14 px
  (`var(--text-small)`, `styles.css:99`); e o viewport tem `user-scalable=no`
  (`index.html:5`). O selo "Beta" com `border-radius: 999px` é desvio que o
  `DESIGN.md` autoriza. O usuário pede a revisão da interface. O agente
  relata os achados com severidade de P0 a P3, cala ou libera o desvio
  autorizado, diz o que mediu e como (sem navegador, "só código") e não
  corrige nada.
tags: [ui-review]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    revisa a interface dessa página (`index.html` com `styles.css`). Ela
    segue a spec aprovada em `docs/devorb/specs/2026-01-01-equipes-design.md`
    e o `DESIGN.md`. Hoje não consigo responder perguntas, então decide
    sozinho o que faltar.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill]
