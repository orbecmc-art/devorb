schema_version: "1.0"
name: visual-direction-clinica-serena
description: >-
  Pasta quase vazia com a spec aprovada da landing page da Clínica Serena,
  odontologia em Goiânia. O cliente só tem o nome e o WhatsApp (62) 90000-0000:
  nenhuma foto, preço, depoimento, nome da equipe, endereço ou horário. O
  usuário manda seguir a spec, fazer a página em `index.html` e `styles.css` e
  avisa que não responde perguntas hoje. O agente define a direção visual
  (modo Persuade) e a grava na spec, e a página não inventa número, depoimento
  ou preço, repete a ação de agendar pelo WhatsApp, não fecha com captura de
  e-mail, está em pt-BR e não tem `href="#"` nem lorem ipsum.
tags: [visual-direction]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    segue a spec aprovada em
    `docs/devorb/specs/2026-01-01-clinica-serena-design.md` e faz a landing
    em `index.html` e `styles.css`. Hoje não consigo responder perguntas,
    então decide sozinho o que faltar.
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill, WebFetch]
