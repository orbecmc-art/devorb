schema_version: "1.0"
name: evolving-no-change
description: Ensaio do ciclo mensal quando a fonte não mudou desde o último commit absorvido.
tags: [evolving, rehearsal, no-change]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Roda o ciclo mensal do DevOrb neste repositório, seguindo a skill evolving.
    É um ensaio: deixa o resultado em fusion/pr-draft.md, atualiza os arquivos
    do repositório como o ciclo pede e não publica nada.
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill]
