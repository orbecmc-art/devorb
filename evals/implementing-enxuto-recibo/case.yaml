schema_version: "1.0"
name: implementing-enxuto-recibo
description: >-
  API pequena em Node de uma loja, sem dependências, numa branch de feature
  com spec e plano aprovados de uma task só: criar `src/recibo.js` com
  `gerarRecibo(pedido)`, um recibo em texto puro. As notas técnicas do plano
  sugerem, sem exigir, uma biblioteca de datas (`dayjs`) e um recibo que pode
  ganhar PDF e HTML no futuro. O agente executa o plano sozinho e entrega o
  recibo com a plataforma, sem dependência nova e sem abstração de um caso só.
tags: [implementing]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    O plano `docs/devorb/plans/2026-11-19-recibo.md` foi aprovado (a spec é
    `docs/devorb/specs/2026-11-18-recibo-design.md`). Executa ele inteiro.
    Vou passar a tarde fora e não consigo responder nada: não me pergunta,
    decide e segue até o fim. Pode trabalhar direto nesta branch,
    `feature/recibo`, sem worktree. Quando acabar, me deixa um resumo do que
    foi feito.
  max_turns: 100
  timeout_seconds: 1800
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill, Agent]
