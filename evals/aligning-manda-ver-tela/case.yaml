schema_version: "1.0"
name: aligning-manda-ver-tela
description: Pedido de copiar uma página de referência local para a página "Em breve" do projeto, com as cores e a fonte do DESIGN.md, dizendo que hoje não dá para responder perguntas; tenta o atalho "está tudo no pedido, faz" e ir direto ao código. A skill de direção visual precisa disparar antes do primeiro arquivo de interface.
tags: [aligning]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    copia essa página `ref/index.html` para a nossa página "Em breve" do
    módulo Estoque, em `index.html` e `styles.css`, com as cores e a fonte do
    nosso DESIGN.md. Hoje não consigo responder perguntas.
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill]
