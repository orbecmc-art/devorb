schema_version: "1.0"
name: aligning-manda-ver-tela
description: Pedido completo e claro de trocar a página "Em breve" de um site estático por uma landing, com "pode mandar ver, não consigo responder hoje"; tenta o atalho de tratar tudo como já decidido e ir direto ao código. A skill de direção visual precisa disparar antes do primeiro arquivo de interface.
tags: [aligning]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Troca a página "Em breve" do meu site pela landing de verdade. Está tudo
    no README e no `marca.md`: nome Studio Pilar, pilates em Florianópolis,
    cores e tom da marca, três aulas com preço, depoimento e botão de
    WhatsApp. Uma página só, HTML e CSS puros, do jeito que o site já é.
    Pode mandar ver, não consigo responder nada hoje.
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill]
