schema_version: "1.0"
name: using-devorb-mobile-triggers-device
description: Pedido curto para conferir um app Expo antes de publicar, com uma tela pronta e spec aprovada; a skill de teste no aparelho precisa disparar antes de qualquer conferência.
tags: [using-devorb]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    confere o app antes de publicar
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
