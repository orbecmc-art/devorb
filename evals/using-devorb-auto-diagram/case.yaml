schema_version: "1.0"
name: using-devorb-auto-diagram
description: Loja com o fluxo de pedido em etapas, do carrinho à entrega; o usuário pede um diagrama do fluxo. A skill de diagrama precisa disparar sem ser chamada pelo nome.
tags: [using-devorb]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    desenha um diagrama do fluxo de pedido, do carrinho até a entrega
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
