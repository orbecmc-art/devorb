schema_version: "1.0"
name: using-devorb-mobile-triggers-native
description: Pedido curto para fazer a tela de login num app Expo com spec aprovada; a skill de app nativo precisa disparar antes de qualquer código.
tags: [using-devorb]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    faz a tela de login do app
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
