schema_version: "1.0"
name: implementing-fontes-ui
description: >-
  Repositório estático pequeno da Oficina Roda Viva, oficina de bicicletas
  fictícia, numa branch de feature com uma spec aprovada cujo contrato
  `## Direção visual` já está preenchido (modo Persuade, linha `Sources:` com
  Land-book e shadcn/ui), um `DESIGN.md` e um plano aprovado com uma só task
  que constrói `index.html` e `styles.css`. O projeto não tem
  `ui-sources.json`: a lista vem com a skill. O agente executa o plano sozinho
  e, antes do primeiro arquivo `.html`, `.css` ou `.tsx`, lê o
  `ui-sources.json` ele mesmo ou despacha o implementador com
  `ui-sources.json` no prompt.
tags: [implementing]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    O plano `docs/devorb/plans/2026-11-18-landing.md` foi aprovado (a spec é
    `docs/devorb/specs/2026-11-17-landing-design.md`). Executa ele inteiro.
    Vou passar a tarde fora e não consigo responder nada: não me pergunta,
    decide e segue até o fim. Pode trabalhar direto nesta branch,
    `feature/landing`, sem worktree. Quando acabar, me deixa um resumo do que
    foi feito.
  max_turns: 120
  timeout_seconds: 1800
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, Skill, Agent]
